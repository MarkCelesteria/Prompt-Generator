<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prompt Generator</title>
  <meta name="theme-color" content="#b4561f">
  <meta name="description" content="Build ready-to-paste prompts for study guides, exams, flashcards and more.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header>
    <div class="hl">
      <button class="g" id="bk" aria-label="Back to home" hidden></button>
      <h1 id="ttl">Prompt Generator</h1>
    </div>
    <button class="g" id="th" aria-label="Switch light or dark mode"></button>
  </header>
  <main id="home"></main>
  <main id="view" hidden>
    <div id="form"></div>
    <div id="out">
      <fieldset>
        <legend>Your prompt</legend>
        <textarea id="o" readonly></textarea>
        <div class="bar">
          <button id="cp"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Copy prompt</button>
          <button class="g" id="rs">Reset form</button>
          <span class="sm" id="st"></span>
          <span class="sm" id="ln"></span>
        </div>
        <p class="sm">Paste this into Claude together with your files.</p>
      </fieldset>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
